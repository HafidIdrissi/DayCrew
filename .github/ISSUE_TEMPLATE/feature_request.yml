name: Feature request
description: Suggest a capability or improvement
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that DayCrew makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Rough is fine.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - core engine
        - CLI
        - provider adapter
        - Team Pack format
        - web dashboard
        - approvals / security
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require a new mandatory service or database (DayCrew is local-first / file-based)
        - label: If this is a new engine or Team Pack, I understand it should not require changes to `packages/core`
