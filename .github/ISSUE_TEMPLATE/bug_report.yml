name: Bug report
description: Something isn't working as documented
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For **security** issues, use private reporting
        instead — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
      placeholder: |
        1. Ran `daycrew ...`
        2. Expected ...
        3. Got ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Commands, `daycrew.json` / Team Pack, and objective if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / events
      description: Paste `events.jsonl` excerpts or CLI output. Redact secrets and paths.
      render: shell
  - type: input
    id: version
    attributes:
      label: DayCrew version / commit
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine in use
      options: [mock, claude-code, codex, gemini-cli, other]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS + Node version
      placeholder: "macOS 14 / Node 20.11"
    validations:
      required: true
