name: Team Pack proposal
description: Propose or submit a data-only professional Team.
title: "[Team Pack]: "
labels: [team-pack]
body:
  - type: input
    id: name
    attributes:
      label: Team name
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: User and use case
    validations:
      required: true
  - type: textarea
    id: roster
    attributes:
      label: Manager and Members
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Contract checks
      options:
        - label: The pack is data and Markdown only.
          required: true
        - label: The pack requires no changes to packages/core.
          required: true
        - label: The pack contains exactly one Manager.
          required: true
